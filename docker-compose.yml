# Full stack locally:  docker compose up --build  →  http://localhost:8080
# Seed demo data once: docker compose exec api node scripts/seed.js
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova_store
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova_store"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      DATABASE_URL: postgres://nova:nova@db:5432/nova_store
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-to-a-long-random-string}
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]

  web:
    build: { context: ., dockerfile: client/Dockerfile }
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
