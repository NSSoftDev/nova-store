<!DOCTYPE html>
<!--
  Nova Store — демо интернет-магазина электроники и lifestyle-товаров.
  Часть портфолио NSSoftDev: https://nssoftdev.com
  Статическое SPA без сборки: каталог, карточка товара, корзина, оформление
  заказа и панель администратора. Данные хранятся в localStorage браузера.
-->
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Store</title>
  <meta name="description" content="Nova Store — демо интернет-магазина: каталог с фильтрами, карточка товара, корзина, оформление заказа с промокодами и панель аналитики." />
  <meta name="theme-color" content="#0b0b10" />
  <meta property="og:title" content="Nova Store — демо интернет-магазина" />
  <meta property="og:description" content="Каталог, корзина, оформление заказа и админ-панель с аналитикой. Проект портфолио NSSoftDev." />
  <meta property="og:image" content="screenshots/01-catalog.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#view">Перейти к содержимому</a>

  <!-- The router (js/app.js) renders the storefront or the admin shell here -->
  <div id="app">
    <noscript>
      <p class="noscript">Для работы Nova Store нужен включённый JavaScript.</p>
    </noscript>
  </div>

  <!-- Order matters: icons → data → state → views → router -->
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
